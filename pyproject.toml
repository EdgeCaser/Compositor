[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "compositor"
version = "0.1.0"
description = "Local workstation for audiobook review, casting, and performance prep"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
compositor = "compositor.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
compositor = ["web/*.html", "web/*.css", "web/*.js"]
