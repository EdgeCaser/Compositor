[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "compositor"
version = "0.1.0"
description = "Local workstation for audiobook review, casting, and performance prep"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]
package = [
    "pyinstaller>=6",
]

[project.scripts]
compositor = "compositor.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "ffmpeg: requires ffmpeg on PATH",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
compositor = ["web/*.html", "web/*.css", "web/*.js"]
